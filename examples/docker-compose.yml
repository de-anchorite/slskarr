# Example stack: slskd + Chaptarr + Lidarr + Slskarr.
# The `downloads` volume is mounted at the SAME path (/downloads) in slskd, Chaptarr and Lidarr, so the
# paths Slskarr reports (Slskarr__Slskd__DownloadsPath + file) are valid for both. Slskarr itself
# never touches the files (it asks slskd to delete them), so it does not mount the volume.
services:
  slskd:
    image: slskd/slskd:latest
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_SLSK_USERNAME: your-soulseek-username
      SLSKD_SLSK_PASSWORD: your-soulseek-password
      SLSKD_API_KEY: change-me-slskd-key   # create an administrator-role key; see README
      SLSKD_REMOTE_FILE_MANAGEMENT: "true" # lets Slskarr delete imported files
      SLSKD_DOWNLOADS_DIR: /downloads
    volumes:
      - slskd-config:/app
      - downloads:/downloads
    ports:
      - "5030:5030"
      - "50300:50300"

  slskarr:
    image: ghcr.io/OWNER/slskarr:latest   # or build: .. (from this directory)
    depends_on:
      - slskd
    environment:
      Slskarr__Slskd__Url: http://slskd:5030
      Slskarr__Slskd__ApiKey: change-me-slskd-key
      Slskarr__Slskd__DownloadsPath: /downloads
      Slskarr__ApiKey: change-me-slskarr-key
    # Bind-mounting a host folder at /data instead? Run as its owner (no PUID/PGID in this image):
    # user: "1000:1000"
    volumes:
      - slskarr-data:/data   # or e.g. /srv/slskarr:/data (must be writable by the container's user)
    ports:
      - "8080:8080"

  chaptarr:
    image: ghcr.io/OWNER/chaptarr:latest   # replace with the Chaptarr image you use
    depends_on:
      - slskarr
    volumes:
      - chaptarr-config:/config
      - downloads:/downloads
      - books:/books
    ports:
      - "8789:8789"

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest   # or the Lidarr image you use
    depends_on:
      - slskarr
    volumes:
      - lidarr-config:/config
      - downloads:/downloads
      - music:/music
    ports:
      - "8686:8686"

volumes:
  downloads:
  slskd-config:
  slskarr-data:
  chaptarr-config:
  books:
  lidarr-config:
  music:
